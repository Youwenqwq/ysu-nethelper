name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          # amd64 default is GOAMD64=v2: runs on J4125-class and older x86-64
          # routers that lack AVX2 (v3 would not start). amd64-v3 is the
          # optional native-speed build for modern CPUs.
          - { goos: linux, goarch: amd64, goamd64: 'v2', output: amd64 }
          - { goos: linux, goarch: amd64, goamd64: 'v3', output: amd64-v3 }
          - { goos: linux, goarch: '386', output: '386' }
          - { goos: linux, goarch: arm64, output: arm64 }
          - { goos: linux, goarch: arm, goarm: '7', output: armv7 }
          - { goos: linux, goarch: mipsle, gomips: softfloat, output: mipsle-softfloat }
          - { goos: linux, goarch: mips, gomips: softfloat, output: mips-softfloat }
          - { goos: linux, goarch: riscv64, output: riscv64 }

          # Darwin (Intel + Apple Silicon)
          - { goos: darwin, goarch: amd64, output: amd64 }
          - { goos: darwin, goarch: arm64, output: arm64 }

          # Windows
          - { goos: windows, goarch: amd64, output: amd64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and compress
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GO386: ${{ matrix.go386 }}
          GOAMD64: ${{ matrix.goamd64 }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          TARGET_NAME: ${{ matrix.output }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          base="ysunethelper_${version}_${GOOS}_${TARGET_NAME}"
          mkdir -p dist

          if [ "$GOOS" = windows ]; then
            binary="dist/${base}.exe"
          else
            binary="dist/${base}"
          fi

          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -buildid=' -o "$binary" ./cmd/ysunethelper

          # Keep the bare binary plus a single-architecture archive.
          if [ "$GOOS" = windows ]; then
            (cd dist && zip -q "${base}.zip" "$(basename "$binary")")
          else
            gzip -c "$binary" > "${binary}.gz"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ysunethelper-${{ matrix.goos }}-${{ matrix.output }}
          path: dist/*
          if-no-files-found: error

  package:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { output: amd64, deb: amd64, rpm: x86_64, pacman: x86_64 }
          - { output: arm64, deb: arm64, rpm: aarch64, pacman: aarch64 }
          - { output: armv7, deb: armhf, rpm: armv7hl, pacman: armv7h }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ysunethelper-linux-${{ matrix.output }}
          path: dist
          merge-multiple: true

      - name: Set package version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build deb/rpm/pacman packages
        env:
          OUTPUT: ${{ matrix.output }}
          DEB_ARCH: ${{ matrix.deb }}
          RPM_ARCH: ${{ matrix.rpm }}
          PACMAN_ARCH: ${{ matrix.pacman }}
        run: |
          set -euo pipefail
          base="ysunethelper_${VERSION}_linux_${OUTPUT}"
          binary="dist/${base}"
          # upload/download artifacts may not preserve the executable bit;
          # install below restores it in the package payload.
          test -f "$binary"
          root="${RUNNER_TEMP}/package-root"
          rm -rf "$root"
          mkdir -p "$root/usr/local/bin" "$root/etc/ysunethelper" "$root/lib/systemd/system"
          install -m 0755 "$binary" "$root/usr/local/bin/ysunethelper"
          install -m 0600 internal/config/template.json "$root/etc/ysunethelper/config.json"
          install -m 0644 deploy/ysunethelper.service "$root/lib/systemd/system/ysunethelper.service"

          export GEM_HOME="${RUNNER_TEMP}/fpm-gems"
          export PATH="${GEM_HOME}/bin:${PATH}"
          gem install --no-document fpm
          package_files=(
            "$root/usr/local/bin/ysunethelper=/usr/local/bin/ysunethelper"
            "$root/etc/ysunethelper/config.json=/etc/ysunethelper/config.json"
            "$root/lib/systemd/system/ysunethelper.service=/lib/systemd/system/ysunethelper.service"
          )
          if [ -n "${DEB_ARCH:-}" ]; then
            fpm -s dir -t deb -n ysunethelper -v "$VERSION" \
              -p "dist/${base}.deb" --architecture "$DEB_ARCH" \
              --description "YSU campus network authentication helper" \
              --license MIT \
              --config-files /etc/ysunethelper/config.json \
              "${package_files[@]}"
          fi
          if [ -n "${RPM_ARCH:-}" ]; then
            fpm -s dir -t rpm -n ysunethelper -v "$VERSION" \
              -p "dist/${base}.rpm" --architecture "$RPM_ARCH" \
              --description "YSU campus network authentication helper" \
              --license MIT \
              --config-files /etc/ysunethelper/config.json \
              "${package_files[@]}"
          fi
          if [ -n "${PACMAN_ARCH:-}" ]; then
            sudo apt-get update
            sudo apt-get install -y libarchive-tools
            fpm -s dir -t pacman -n ysunethelper -v "$VERSION" \
              -p "dist/${base}.pkg.tar.zst" --architecture "$PACMAN_ARCH" \
              --description "YSU campus network authentication helper" \
              --license MIT \
              --config-files /etc/ysunethelper/config.json \
              "${package_files[@]}"
          fi

      - name: Verify package configuration metadata
        env:
          OUTPUT: ${{ matrix.output }}
          DEB_ARCH: ${{ matrix.deb }}
          RPM_ARCH: ${{ matrix.rpm }}
          PACMAN_ARCH: ${{ matrix.pacman }}
        run: |
          set -euo pipefail
          base="ysunethelper_${VERSION}_linux_${OUTPUT}"
          config="/etc/ysunethelper/config.json"

          if [ -n "${DEB_ARCH:-}" ]; then
            extract="${RUNNER_TEMP}/package-check-deb"
            control="${RUNNER_TEMP}/package-check-control"
            rm -rf "$extract" "$control"
            mkdir -p "$extract" "$control"
            dpkg-deb -x "dist/${base}.deb" "$extract"
            dpkg-deb -e "dist/${base}.deb" "$control"
            test -f "$extract$config"
            test "$(stat -c '%a' "$extract$config")" = "600"
            cmp "$extract$config" internal/config/template.json
            test "$(cat "$control/conffiles")" = "$config"
          fi

          if [ -n "${RPM_ARCH:-}" ]; then
            test "$(rpm -qp --configfiles "dist/${base}.rpm")" = "$config"
          fi

          if [ -n "${PACMAN_ARCH:-}" ]; then
            extract="${RUNNER_TEMP}/package-check-pacman"
            pkginfo="${RUNNER_TEMP}/package-check-pkginfo"
            rm -rf "$extract"
            mkdir -p "$extract"
            bsdtar -xf "dist/${base}.pkg.tar.zst" -C "$extract" \
              etc/ysunethelper/config.json .PKGINFO
            test "$(stat -c '%a' "$extract/etc/ysunethelper/config.json")" = "600"
            cmp "$extract/etc/ysunethelper/config.json" internal/config/template.json
            bsdtar -xOf "dist/${base}.pkg.tar.zst" .PKGINFO > "$pkginfo"
            case "$(cat "$pkginfo")" in
              *"backup = etc/ysunethelper/config.json"*|*"backup = /etc/ysunethelper/config.json"*) ;;
              *) echo "pacman package does not mark the config as backup" >&2; exit 1 ;;
            esac
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ysunethelper-linux-packages-${{ matrix.output }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    needs: [build, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download all architecture artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ysunethelper-*
          path: artifacts
          merge-multiple: true

      - name: Select release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="release-notes/${VERSION}.md"
          test -f "$notes_file"
          cp "$notes_file" "${RUNNER_TEMP}/release-notes.md"

      - name: Publish GitHub Release
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t release_files < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${release_files[@]}"

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          # amd64 default is GOAMD64=v2: runs on J4125-class and older x86-64
          # routers that lack AVX2 (v3 would not start). amd64-v3 is the
          # optional native-speed build for modern CPUs.
          - { goos: linux, goarch: amd64, goamd64: 'v2', output: amd64 }
          - { goos: linux, goarch: amd64, goamd64: 'v3', output: amd64-v3 }
          - { goos: linux, goarch: '386', output: '386' }
          - { goos: linux, goarch: arm64, output: arm64 }
          - { goos: linux, goarch: arm, goarm: '7', output: armv7 }
          - { goos: linux, goarch: mipsle, gomips: softfloat, output: mipsle-softfloat }
          - { goos: linux, goarch: mips, gomips: softfloat, output: mips-softfloat }
          - { goos: linux, goarch: riscv64, output: riscv64 }

          # Darwin (Intel + Apple Silicon)
          - { goos: darwin, goarch: amd64, output: amd64 }
          - { goos: darwin, goarch: arm64, output: arm64 }

          # Windows
          - { goos: windows, goarch: amd64, output: amd64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and compress
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GO386: ${{ matrix.go386 }}
          GOAMD64: ${{ matrix.goamd64 }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          TARGET_NAME: ${{ matrix.output }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          base="ysunethelper_${version}_${GOOS}_${TARGET_NAME}"
          mkdir -p dist

          if [ "$GOOS" = windows ]; then
            binary="dist/${base}.exe"
          else
            binary="dist/${base}"
          fi

          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -buildid=' -o "$binary" ./cmd/ysunethelper

          # Keep the bare binary plus a single-architecture archive.
          if [ "$GOOS" = windows ]; then
            (cd dist && zip -q "${base}.zip" "$(basename "$binary")")
          else
            gzip -c "$binary" > "${binary}.gz"
          fi

      - name: Generate checksums
        env:
          TARGET_NAME: ${{ matrix.output }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          base="ysunethelper_${version}_${{ matrix.goos }}_${TARGET_NAME}"
          sha256sum dist/* > "dist/${base}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ysunethelper-${{ matrix.goos }}-${{ matrix.output }}
          path: dist/*
          if-no-files-found: error

  package:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { output: amd64, deb: amd64, rpm: x86_64, pacman: x86_64 }
          - { output: arm64, deb: arm64, rpm: aarch64, pacman: aarch64 }
          - { output: armv7, deb: armhf, rpm: armv7hl, pacman: armv7h }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ysunethelper-linux-${{ matrix.output }}
          path: dist
          merge-multiple: true

      - name: Set package version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build deb/rpm/pacman packages
        env:
          OUTPUT: ${{ matrix.output }}
          DEB_ARCH: ${{ matrix.deb }}
          RPM_ARCH: ${{ matrix.rpm }}
          PACMAN_ARCH: ${{ matrix.pacman }}
        run: |
          set -euo pipefail
          base="ysunethelper_${VERSION}_linux_${OUTPUT}"
          binary="dist/${base}"
          test -x "$binary"
          root="${RUNNER_TEMP}/package-root"
          rm -rf "$root"
          mkdir -p "$root/usr/local/bin" "$root/lib/systemd/system"
          install -m 0755 "$binary" "$root/usr/local/bin/ysunethelper"
          install -m 0644 deploy/ysunethelper.service "$root/lib/systemd/system/ysunethelper.service"

          sudo gem install --no-document fpm
          if [ -n "${DEB_ARCH:-}" ]; then
            fpm -s dir -t deb -n ysunethelper -v "$VERSION" \
              -p "dist/${base}.deb" --architecture "$DEB_ARCH" \
              --description "燕山大学校园网认证助手" \
              --license MIT \
              "$root/usr=/usr" "$root/lib=/lib"
          fi
          if [ -n "${RPM_ARCH:-}" ]; then
            fpm -s dir -t rpm -n ysunethelper -v "$VERSION" \
              -p "dist/${base}.rpm" --architecture "$RPM_ARCH" \
              --description "燕山大学校园网认证助手" \
              --license MIT \
              "$root/usr=/usr" "$root/lib=/lib"
          fi
          if [ -n "${PACMAN_ARCH:-}" ]; then
            sudo apt-get update
            sudo apt-get install -y libarchive-tools
            fpm -s dir -t pacman -n ysunethelper -v "$VERSION" \
              -p "dist/${base}.pkg.tar.zst" --architecture "$PACMAN_ARCH" \
              --description "燕山大学校园网认证助手" \
              --license MIT \
              "$root/usr=/usr" "$root/lib=/lib"
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ysunethelper-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    needs: [build, package]
    runs-on: ubuntu-latest
    steps:
      - name: Download all architecture artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ysunethelper-*
          path: artifacts
          merge-multiple: true

      - name: Create all-architectures archive
        working-directory: artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          mapfile -t binaries < <(find . -maxdepth 1 -type f \
            ! -name '*.gz' ! -name '*.zip' ! -name '*.deb' \
            ! -name '*.rpm' ! -name '*.pkg.tar.zst' ! -name '*.sha256' \
            -printf '%f\n' | sort)
          ((${#binaries[@]} > 0))
          tar -czf "ysunethelper_${version}_all_architectures.tar.gz" "${binaries[@]}"

      - name: Generate release checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name 'sha256sums.txt' -printf '%f\n' | sort > release-files.txt
          test -s release-files.txt
          sha256sum -- $(cat release-files.txt) > sha256sums.txt
          rm release-files.txt

      - name: Publish GitHub Release
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t release_files < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${release_files[@]}"

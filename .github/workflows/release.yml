name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (for example v0.5.2)
        required: true
        type: string

permissions:
  contents: read

# Runs for the same tag share Release assets; don't let them overwrite each other.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Prepare draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "$RELEASE_TAG" \
              --notes ""
          fi

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          # amd64 default is GOAMD64=v2: runs on J4125-class and older x86-64
          # routers that lack AVX2 (v3 would not start). amd64-v3 is the
          # optional native-speed build for modern CPUs.
          - { goos: linux, goarch: amd64, goamd64: 'v2', output: amd64 }
          - { goos: linux, goarch: amd64, goamd64: 'v3', output: amd64-v3 }
          - { goos: linux, goarch: '386', output: '386' }
          - { goos: linux, goarch: arm64, output: arm64 }
          - { goos: linux, goarch: arm, goarm: '7', output: armv7 }
          - { goos: linux, goarch: mipsle, gomips: softfloat, output: mipsle-softfloat }
          - { goos: linux, goarch: mips, gomips: softfloat, output: mips-softfloat }
          - { goos: linux, goarch: riscv64, output: riscv64 }

          # Android builds with the NDK toolchain used by Mihomo.
          - { goos: android, goarch: '386', ndk: i686-linux-android34, output: '386' }
          - { goos: android, goarch: amd64, ndk: x86_64-linux-android34, output: amd64 }
          - { goos: android, goarch: arm, ndk: armv7a-linux-androideabi34, output: armv7 }
          - { goos: android, goarch: arm64, ndk: aarch64-linux-android34, output: arm64-v8 }

          # Darwin (Intel + Apple Silicon)
          - { goos: darwin, goarch: amd64, output: amd64 }
          - { goos: darwin, goarch: arm64, output: arm64 }

          # Windows
          - { goos: windows, goarch: amd64, output: amd64 }
          - { goos: windows, goarch: arm64, output: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Android NDK
        if: matrix.goos == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          TARGET_NAME: ${{ matrix.output }}
          VERSION: ${{ env.RELEASE_TAG }}
          # Android only: clang prefix from the matrix and the NDK root
          # installed above. Unused for non-Android targets.
          NDK_ABI: ${{ matrix.ndk }}
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          base="ysunethelper_${version}_${GOOS}_${TARGET_NAME}"
          mkdir -p dist

          if [ "$GOOS" = windows ]; then
            binary="dist/${base}.exe"
          else
            binary="dist/${base}"
          fi

          ldflags="-s -w -buildid= -X main.version=${VERSION}"

          if [ "$GOOS" = android ]; then
            # Go requires external (cgo) linking for android/* targets, so we
            # cannot use CGO_ENABLED=0 here. Point CC at the NDK clang wrapper.
            export CGO_ENABLED=1
            export CC="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/${NDK_ABI}-clang"
            test -x "$CC" || { echo "NDK clang not found: $CC" >&2; exit 1; }
            go build -trimpath -ldflags="$ldflags" -o "$binary" ./cmd/ysunethelper
          else
            CGO_ENABLED=0 go build -trimpath -ldflags="$ldflags" -o "$binary" ./cmd/ysunethelper
          fi

      - name: Upload binary directly to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # --clobber lets failed matrix jobs be rerun for the same tag.
          gh release upload "$RELEASE_TAG" dist/* \
            --clobber

  package:
    needs: build
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { output: amd64, deb: amd64, rpm: x86_64, pacman: x86_64 }
          - { output: arm64, deb: arm64, rpm: aarch64, pacman: aarch64 }
          - { output: armv7, deb: armhf, rpm: armv7hl, pacman: armv7h }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Set package version
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Download Linux binary from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTPUT: ${{ matrix.output }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --pattern "ysunethelper_${VERSION}_linux_${OUTPUT}" \
            --dir dist

      - name: Build deb/rpm/pacman packages
        env:
          OUTPUT: ${{ matrix.output }}
          DEB_ARCH: ${{ matrix.deb }}
          RPM_ARCH: ${{ matrix.rpm }}
          PACMAN_ARCH: ${{ matrix.pacman }}
        run: |
          set -euo pipefail
          base="ysunethelper_${VERSION}_linux_${OUTPUT}"
          binary="dist/${base}"
          # Release asset downloads don't preserve the executable bit;
          # install below restores it in the package payload.
          test -f "$binary"
          root="${RUNNER_TEMP}/package-root"
          rm -rf "$root"
          mkdir -p "$root/usr/local/bin" "$root/etc/ysunethelper" "$root/lib/systemd/system"
          install -m 0755 "$binary" "$root/usr/local/bin/ysunethelper"
          install -m 0600 internal/config/template.json "$root/etc/ysunethelper/config.json"
          install -m 0644 deploy/ysunethelper.service "$root/lib/systemd/system/ysunethelper.service"

          export GEM_HOME="${RUNNER_TEMP}/fpm-gems"
          export PATH="${GEM_HOME}/bin:${PATH}"
          gem install --no-document fpm
          package_files=(
            "$root/usr/local/bin/ysunethelper=/usr/local/bin/ysunethelper"
            "$root/etc/ysunethelper/config.json=/etc/ysunethelper/config.json"
            "$root/lib/systemd/system/ysunethelper.service=/lib/systemd/system/ysunethelper.service"
          )
          if [ -n "${DEB_ARCH:-}" ]; then
            fpm -s dir -t deb -n ysunethelper -v "$VERSION" \
              -p "dist/${base}.deb" --architecture "$DEB_ARCH" \
              --description "YSU campus network authentication helper" \
              --license MIT \
              --config-files /etc/ysunethelper/config.json \
              "${package_files[@]}"
          fi
          if [ -n "${RPM_ARCH:-}" ]; then
            fpm -s dir -t rpm -n ysunethelper -v "$VERSION" \
              -p "dist/${base}.rpm" --architecture "$RPM_ARCH" \
              --description "YSU campus network authentication helper" \
              --license MIT \
              --config-files /etc/ysunethelper/config.json \
              "${package_files[@]}"
          fi
          if [ -n "${PACMAN_ARCH:-}" ]; then
            sudo apt-get update
            sudo apt-get install -y libarchive-tools
            fpm -s dir -t pacman -n ysunethelper -v "$VERSION" \
              -p "dist/${base}.pkg.tar.zst" --architecture "$PACMAN_ARCH" \
              --description "YSU campus network authentication helper" \
              --license MIT \
              --config-files /etc/ysunethelper/config.json \
              "${package_files[@]}"
          fi

      - name: Verify package configuration metadata
        env:
          OUTPUT: ${{ matrix.output }}
          DEB_ARCH: ${{ matrix.deb }}
          RPM_ARCH: ${{ matrix.rpm }}
          PACMAN_ARCH: ${{ matrix.pacman }}
        run: |
          set -euo pipefail
          base="ysunethelper_${VERSION}_linux_${OUTPUT}"
          config="/etc/ysunethelper/config.json"

          if [ -n "${DEB_ARCH:-}" ]; then
            extract="${RUNNER_TEMP}/package-check-deb"
            control="${RUNNER_TEMP}/package-check-control"
            rm -rf "$extract" "$control"
            mkdir -p "$extract" "$control"
            dpkg-deb -x "dist/${base}.deb" "$extract"
            dpkg-deb -e "dist/${base}.deb" "$control"
            test -f "$extract$config"
            test "$(stat -c '%a' "$extract$config")" = "600"
            cmp "$extract$config" internal/config/template.json
            test "$(cat "$control/conffiles")" = "$config"
          fi

          if [ -n "${RPM_ARCH:-}" ]; then
            test "$(rpm -qp --configfiles "dist/${base}.rpm")" = "$config"
          fi

          if [ -n "${PACMAN_ARCH:-}" ]; then
            extract="${RUNNER_TEMP}/package-check-pacman"
            pkginfo="${RUNNER_TEMP}/package-check-pkginfo"
            rm -rf "$extract"
            mkdir -p "$extract"
            bsdtar -xf "dist/${base}.pkg.tar.zst" -C "$extract" \
              etc/ysunethelper/config.json .PKGINFO
            test "$(stat -c '%a' "$extract/etc/ysunethelper/config.json")" = "600"
            cmp "$extract/etc/ysunethelper/config.json" internal/config/template.json
            bsdtar -xOf "dist/${base}.pkg.tar.zst" .PKGINFO > "$pkginfo"
            case "$(cat "$pkginfo")" in
              *"backup = etc/ysunethelper/config.json"*|*"backup = /etc/ysunethelper/config.json"*) ;;
              *) echo "pacman package does not mark the config as backup" >&2; exit 1 ;;
            esac
          fi

      - name: Upload packages directly to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTPUT: ${{ matrix.output }}
        run: |
          set -euo pipefail
          base="ysunethelper_${VERSION}_linux_${OUTPUT}"
          gh release upload "$RELEASE_TAG" \
            "dist/${base}.deb" \
            "dist/${base}.rpm" \
            "dist/${base}.pkg.tar.zst" \
            --clobber

  release:
    needs: [build, package]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Generate Release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          gh release download "$RELEASE_TAG" --dir dist --pattern "ysunethelper_${version}_*"
          (
            cd dist
            sha256sum ysunethelper_* > SHA256SUMS
          )
          gh release upload "$RELEASE_TAG" dist/SHA256SUMS --clobber

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # This job runs only after every binary and package upload succeeds.
          # A failed new release stays a draft, with its successful uploads intact.
          # Leave the title and release notes managed through GitHub Releases intact.
          gh release edit "$RELEASE_TAG" --draft=false
